[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.11", features = ["json", "blocking", "tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"

